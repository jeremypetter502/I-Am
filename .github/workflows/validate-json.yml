name: Validate ContextFile JSON
on:
  push:
    paths:
      - 'specs/001-personality-context-site/**'
      - 'package.json'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'specs/001-personality-context-site/**'

jobs:
  validate-json:
    name: Validate ContextFile JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build UI
        run: npm run build:ui
      - name: Run JSON validator
        run: npm run validate:json
      - name: Run tests
        run: npm test
